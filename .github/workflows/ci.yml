# Runs on every PR: lint, unit tests, and contract checks (codegen diff, plugin
# import-boundary lint, manifest schema validation, cz check on PR title).
name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make setup
      - name: Lint (Go + TS + import boundaries)
        run: make lint
      - name: Unit tests
        run: make test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make setup
      - name: Codegen is up to date (regenerate-and-diff + hand-edit detection)
        run: |
          make generate
          git diff --exit-code -- \
            kernel/pkg/model/model_gen.go \
            kernel/internal/gateway/queryapi/server_gen.go \
            packages/query-client/src/types.gen.ts \
            || (echo "::error::generated code is stale or hand-edited — run 'make generate' and commit" && exit 1)
      - name: Generated Go compiles
        run: (cd kernel && go build ./...) && (cd cli && go build ./...)
      - name: Generated TypeScript builds
        run: pnpm --filter @llmobs/query-client build
      - name: Validate schemas + examples + field registry
        run: |
          python3 -m pip install --quiet jsonschema referencing
          python3 scripts/validate_schemas.py
      - name: Merge vectors in the spec stay machine-parseable
        run: python3 scripts/check_merge_vectors.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile --filter @llmobs/shell... --filter @llmobs/plugin-tracing...
      - name: Build design system, SDK, shell (MF host), and tracing plugin (MF remote)
        run: |
          pnpm --filter @llmobs/query-client build
          pnpm --filter @llmobs/brand build
          pnpm --filter @llmobs/tokens build
          pnpm --filter @llmobs/ui build
          pnpm --filter @llmobs/schema-form build
          pnpm --filter @llmobs/plugin-sdk build
          NODE_ENV=production pnpm --filter @llmobs/shell build
          NODE_ENV=production pnpm --filter @llmobs/plugin-tracing build
      - name: Typecheck the shell + SDK + tracing plugin
        run: |
          pnpm --filter @llmobs/shell typecheck
          pnpm --filter @llmobs/plugin-sdk typecheck
          pnpm --filter @llmobs/plugin-tracing typecheck
      - name: Shared singletons are declared (no plugin can bundle its own copy)
        run: pnpm --filter @llmobs/shell check:singletons
      - name: Brand guard (display name only in @llmobs/brand)
        run: bash scripts/check_brand.sh

  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: cz check on PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$PR_TITLE"

  # The language-agnostic proof (H7): a Python backend verifies a Go-kernel-signed
  # token vector, and the Langfuse->OTLP translation is exercised. Enforces that the
  # plugin contract stays speakable from a non-Go backend.
  plugin-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: make plugin-python-test
