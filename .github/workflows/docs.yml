# Build and deploy the docs site on merges to main.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make setup
      - name: Build docs site
        run: echo "build docs/ (Docusaurus or similar)"
      - name: Deploy
        run: echo "deploy docs site"
