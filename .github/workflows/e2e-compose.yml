# Lite profile end-to-end: compose up, loadgen smoke, assert a trace is visible
# end-to-end. Runs on PRs targeting develop or release/*.
name: e2e-compose

on:
  pull_request:
    branches: [develop, "release/**"]

permissions:
  contents: read

jobs:
  e2e-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make setup
      - name: Lite profile up + loadgen smoke + trace visible
        run: make e2e

  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make setup
      - name: Browser smoke — login → manifest nav → traces → span tree
        run: bash scripts/e2e-web.sh

  # Fully-live plugin e2e (H7c): kernel + the langfuse-compat Python backend both
  # up — supervisor handshake + service-token delivery -> running, and an unmodified
  # Langfuse-wire ingestion migrates a trace end-to-end (LANGFUSE_HOST->us).
  e2e-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kernel + Python plugin — live handshake + token delivery + migration
        run: make e2e-plugin
