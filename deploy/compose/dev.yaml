# Dev profile: JUST Postgres, published to the host, for `make dev` (J3).
# `make dev` runs the kernel with `go run` and the shell + plugin with their rspack
# dev servers locally — so only the database needs to be containerized. The kernel
# reaches it at localhost:5432.
#   docker compose --env-file deploy/compose/dev.env -f deploy/compose/dev.yaml up -d
# (the env-file supplies the required POSTGRES_PASSWORD; see dev.env)
name: llmobs-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: llmobs
      # Required, no default: a compose-up without deploy/compose/dev.env (or a real
      # secret) fails loudly rather than booting with a known password. See dev.env.
      POSTGRES_PASSWORD: "${LLMOBS_POSTGRES_PASSWORD:?set LLMOBS_POSTGRES_PASSWORD — use --env-file deploy/compose/dev.env for dev, or your secret store}"
      POSTGRES_DB: llmobs
    ports:
      # Published to the host so the locally-run kernel can connect. Override the
      # host port with LLMOBS_DEV_PG_PORT if 5432 is taken.
      - "${LLMOBS_DEV_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmobs -d llmobs"]
      interval: 2s
      timeout: 3s
      retries: 40
