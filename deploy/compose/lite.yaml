# Lite profile: Postgres + the kernel daemon, one command up.
#   docker compose --env-file deploy/compose/dev.env -f deploy/compose/lite.yaml up -d
# Credentials are REQUIRED (${VAR:?...}) with no inline defaults, so a copy of this
# file run without an env-file fails loudly instead of booting with a known password.
# dev.env carries throwaway dev/CI values; a real deployment supplies its own.
# The kernel bootstraps a default org/project/api-key on first boot.
name: llmobs-lite

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: llmobs
      # Required, no default: a compose-up without deploy/compose/dev.env (or a real
      # secret) fails loudly rather than booting with a known password. See dev.env.
      POSTGRES_PASSWORD: "${LLMOBS_POSTGRES_PASSWORD:?set LLMOBS_POSTGRES_PASSWORD — use --env-file deploy/compose/dev.env for dev, or your secret store}"
      POSTGRES_DB: llmobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmobs -d llmobs"]
      interval: 2s
      timeout: 3s
      retries: 40
    # Not published to the host: the kernel reaches Postgres over the compose
    # network. Add an override to expose 5432 for local inspection if needed.

  kernel:
    build:
      context: ../..
      dockerfile: deploy/compose/kernel.Dockerfile
    environment:
      LLMOBS_DATABASE_URL: "postgres://llmobs:${LLMOBS_POSTGRES_PASSWORD:?set LLMOBS_POSTGRES_PASSWORD — use --env-file deploy/compose/dev.env for dev, or your secret store}@postgres:5432/llmobs?sslmode=disable"
      LLMOBS_BOOTSTRAP_API_KEY: "${LLMOBS_BOOTSTRAP_API_KEY:?set LLMOBS_BOOTSTRAP_API_KEY — use --env-file deploy/compose/dev.env for dev, or your secret store}"
      LLMOBS_BOOTSTRAP_ADMIN_EMAIL: "${LLMOBS_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}"
      LLMOBS_BOOTSTRAP_ADMIN_PASSWORD: "${LLMOBS_BOOTSTRAP_ADMIN_PASSWORD:?set LLMOBS_BOOTSTRAP_ADMIN_PASSWORD — use --env-file deploy/compose/dev.env for dev, or your secret store}"
      LLMOBS_LOG_FORMAT: "text"
      LLMOBS_OTLP_HTTP_ADDR: ":4318"
      LLMOBS_OTLP_GRPC_ADDR: ":4317"
      LLMOBS_API_ADDR: ":8080"
      LLMOBS_METRICS_ADDR: ":9090"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LLMOBS_OTLP_PORT:-4318}:4318"
      - "${LLMOBS_OTLP_GRPC_PORT:-4317}:4317"
      - "${LLMOBS_API_PORT:-8080}:8080"
      - "${LLMOBS_METRICS_PORT:-9090}:9090"
