# Scale profile (foundation): Postgres + ClickHouse + the kernel.
#   docker compose --env-file deploy/compose/dev.env -f deploy/compose/scale.yaml up -d
# Credentials are REQUIRED (${VAR:?...}) with no inline defaults — a run without an
# env-file fails loudly rather than booting with a known password (see dev.env).
#
# Per RULING-MIG6 (permanent dual-read), Postgres is NOT replaced by ClickHouse —
# it stays as the historical/lite store while ClickHouse takes new high-volume
# telemetry, unified at the one Query API. L1 provisions the ClickHouse schema +
# write side; the kernel's read path over ClickHouse lands in L2, so this compose
# is the storage foundation, not yet a fully wired scale runtime.
name: llmobs-scale

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: llmobs
      # Required, no default: a compose-up without deploy/compose/dev.env (or a real
      # secret) fails loudly rather than booting with a known password. See dev.env.
      POSTGRES_PASSWORD: "${LLMOBS_POSTGRES_PASSWORD:?set LLMOBS_POSTGRES_PASSWORD — use --env-file deploy/compose/dev.env for dev, or your secret store}"
      POSTGRES_DB: llmobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmobs -d llmobs"]
      interval: 2s
      timeout: 3s
      retries: 40

  clickhouse:
    # R-CH5: pin the ClickHouse version; never :latest. Supported range documented
    # in deploy/compose/clickhouse/README.md. 24.8 is an LTS.
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: llmobs
      CLICKHOUSE_USER: llmobs
      # Required, no default (see POSTGRES_PASSWORD above / dev.env).
      CLICKHOUSE_PASSWORD: "${LLMOBS_CLICKHOUSE_PASSWORD:?set LLMOBS_CLICKHOUSE_PASSWORD — use --env-file deploy/compose/dev.env for dev, or your secret store}"
      # Let the bootstrap user self-manage grants in this single-node profile; a
      # real cluster grants the exact set from clickhouse.RequiredGrants() (R-CH8).
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      # R-CH6: bound the system.*_log tables (profiler off + TTL).
      - ./clickhouse/config.d/system-log-ttl.xml:/etc/clickhouse-server/config.d/system-log-ttl.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "llmobs", "--password", "${LLMOBS_CLICKHOUSE_PASSWORD:?set LLMOBS_CLICKHOUSE_PASSWORD — see deploy/compose/dev.env}", "-q", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 40

  valkey:
    # R-EV3: Valkey (Redis-protocol-compatible) for the scale event bus. Version
    # pinned; the adapter feature-detects (DisableIdentity) rather than version-gating.
    image: valkey/valkey:8
    # #112 — durable + NON-EVICTING config for the event-bus Streams backlog. Stock
    # defaults (no AOF, an eviction-capable maxmemory-policy) can silently lose or evict
    # unconsumed Streams entries — an at-least-once-delivery break.
    #   --appendonly yes / --appendfsync everysec: fsync the AOF so an unconsumed backlog
    #     survives a restart (RDB snapshots between saves can drop it); ~1s durability
    #     window keeps throughput acceptable.
    #   --maxmemory-policy noeviction: NEVER evict stream entries under memory pressure —
    #     a full memory returns an error to the producer (loud backpressure) instead of
    #     silently dropping backlog. Memory is bounded by the committed-watermark trim
    #     (#98, in the adapter), not by eviction.
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 40
    volumes:
      - valkey-data:/data

  minio:
    # S3-compatible object store for the blobs primitive (ADR-0037). The scale profile
    # uses a shared object store, not per-container local disk. Version pinned.
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${LLMOBS_BLOB_S3_ACCESS_KEY:?set LLMOBS_BLOB_S3_ACCESS_KEY — see deploy/compose/dev.env}"
      MINIO_ROOT_PASSWORD: "${LLMOBS_BLOB_S3_SECRET_KEY:?set LLMOBS_BLOB_S3_SECRET_KEY — see deploy/compose/dev.env}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 40
    volumes:
      - minio-data:/data

  # One-shot: create the blobs bucket and enable default-encryption + block-public-access,
  # so the bucket meets the operator security requirements the kernel checks at boot.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set m http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb -p m/llmobs-blobs &&
        mc anonymous set none m/llmobs-blobs &&
        mc encrypt set sse-s3 m/llmobs-blobs || true
    environment:
      MINIO_ROOT_USER: "${LLMOBS_BLOB_S3_ACCESS_KEY:?set LLMOBS_BLOB_S3_ACCESS_KEY — see deploy/compose/dev.env}"
      MINIO_ROOT_PASSWORD: "${LLMOBS_BLOB_S3_SECRET_KEY:?set LLMOBS_BLOB_S3_SECRET_KEY — see deploy/compose/dev.env}"

  kernel:
    build:
      context: ../..
      dockerfile: deploy/compose/kernel.Dockerfile
    environment:
      LLMOBS_DATABASE_URL: "postgres://llmobs:${LLMOBS_POSTGRES_PASSWORD:?set LLMOBS_POSTGRES_PASSWORD — see deploy/compose/dev.env}@postgres:5432/llmobs?sslmode=disable"
      # Native protocol DSN; credentials are URL-safe-encoded when built via
      # clickhouse.BuildDSN (R-CH7). Read by the scale storage wiring in L2.
      LLMOBS_CLICKHOUSE_URL: "clickhouse://llmobs:${LLMOBS_CLICKHOUSE_PASSWORD:?set LLMOBS_CLICKHOUSE_PASSWORD — see deploy/compose/dev.env}@clickhouse:9000/llmobs"
      # Setting CLICKHOUSE_URL turns on PERMANENT dual-read (ADR-0026 RULING-MIG6):
      # historical Postgres-lite data and new ClickHouse-scale data are unified on
      # every Query-API read, so nothing is stranded crossing the boundary (L5). The
      # OPTIONAL lite→scale backfill (below) moves cold rows onto scale over time; it
      # is resumable, runs on its own budget, and is decoupled from boot readiness —
      # a partial backfill is fully correct via dual-read. Off by default; enable with:
      #   LLMOBS_BACKFILL_ON_BOOT: "true"     # start the background backfill on boot
      #   LLMOBS_BACKFILL_CHUNK_SIZE: "500"   # rows per bounded batch
      #   LLMOBS_BACKFILL_BUDGET: "30m"       # SEPARATE execution budget per run (not the read timeout)
      # Read-after-write across CH replicas (#109): OFF by default. A single/sticky endpoint
      # gives read-after-write for free. Set true ONLY for a multi-replica cluster behind a
      # distributing LB with a hard RYW need — it enables insert_quorum + sequential
      # consistency at the cost of quorum write latency (see docs/self-hosting).
      #   LLMOBS_CH_READ_YOUR_WRITES: "false"
      LLMOBS_BOOTSTRAP_API_KEY: "${LLMOBS_BOOTSTRAP_API_KEY:?set LLMOBS_BOOTSTRAP_API_KEY — see deploy/compose/dev.env}"
      LLMOBS_BOOTSTRAP_ADMIN_EMAIL: "${LLMOBS_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}"
      LLMOBS_BOOTSTRAP_ADMIN_PASSWORD: "${LLMOBS_BOOTSTRAP_ADMIN_PASSWORD:?set LLMOBS_BOOTSTRAP_ADMIN_PASSWORD — see deploy/compose/dev.env}"
      # Durable WAL ingest spool (ADR-0027): the ack becomes durable when bytes hit
      # this local WAL, and undrained records replay on boot. Backed by a volume so
      # the WAL survives container restarts.
      LLMOBS_INGEST_SPOOL_DIR: "/var/lib/llmobs/wal"
      # Scale event bus (ADR-0028): Redis/Valkey Streams instead of Postgres. For HA,
      # set LLMOBS_EVENT_REDIS_MASTER_NAME + LLMOBS_EVENT_REDIS_SENTINEL_ADDRS (R-EV1).
      LLMOBS_EVENT_REDIS_URL: "redis://valkey:6379/0"
      # Blobs primitive (ADR-0037): the scale profile uses the S3-compatible adapter (a
      # shared object store), NOT the per-container local filesystem. A production bucket
      # must have block-public-access + default-encryption enabled (the kernel warns at boot
      # if the bucket has no default-encryption policy).
      LLMOBS_BLOB_S3_ENDPOINT: "minio:9000"
      LLMOBS_BLOB_S3_ACCESS_KEY: "${LLMOBS_BLOB_S3_ACCESS_KEY:?set LLMOBS_BLOB_S3_ACCESS_KEY — see deploy/compose/dev.env}"
      LLMOBS_BLOB_S3_SECRET_KEY: "${LLMOBS_BLOB_S3_SECRET_KEY:?set LLMOBS_BLOB_S3_SECRET_KEY — see deploy/compose/dev.env}"
      LLMOBS_BLOB_S3_BUCKET: "llmobs-blobs"
      LLMOBS_BLOB_S3_USE_SSL: "false"
      LLMOBS_LOG_FORMAT: "text"
      LLMOBS_OTLP_HTTP_ADDR: ":4318"
      LLMOBS_OTLP_GRPC_ADDR: ":4317"
      LLMOBS_API_ADDR: ":8080"
      LLMOBS_METRICS_ADDR: ":9090"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - kernel-wal:/var/lib/llmobs/wal
    ports:
      - "${LLMOBS_OTLP_PORT:-4318}:4318"
      - "${LLMOBS_OTLP_GRPC_PORT:-4317}:4317"
      - "${LLMOBS_API_PORT:-8080}:8080"
      - "${LLMOBS_METRICS_PORT:-9090}:9090"

volumes:
  clickhouse-data:
  kernel-wal:
  valkey-data:
  minio-data:
