# pnpm workspace: the web shell, the TypeScript packages, and every first-party
# plugin frontend. Plugin frontends are laid out exactly like third-party ones,
# so they participate in the same workspace during development.
packages:
  - "web/shell"
  - "web/e2e"
  - "packages/*"
  - "plugins/*/frontend"
  - "templates/*/frontend"
# Approve the native build scripts we trust (pnpm 11 blocks all by default). esbuild
# ships with vitest (the SDK's test runner); its postinstall fetches the platform
# binary. Without this, `pnpm install` / `pnpm run` hard-fail the deps-status check.
onlyBuiltDependencies:
  - esbuild

